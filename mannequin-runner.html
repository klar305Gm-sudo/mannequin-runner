<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d1c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>المانيكان العدّاء</title>
<style>
:root{--bg:#e9e6f2;--ink:#1d1a33;--sub:#5d5880;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d1c;--ink:#f3efe6;--sub:#9a96bd}}
:root[data-theme="dark"]{--bg:#0b0d1c;--ink:#f3efe6;--sub:#9a96bd}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Tahoma",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;-webkit-user-select:none;user-select:none}
h1{margin:0;font-size:1.4rem;font-weight:800}
p{margin:0;color:var(--sub);font-size:.9rem;text-align:center}
canvas{width:100%;max-width:900px;aspect-ratio:2/1;border-radius:14px;touch-action:none;display:block;cursor:pointer}
#menu{width:100%;max-width:900px;text-align:center}
#lv{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.lb{display:flex;flex-direction:column;gap:3px;padding:12px 4px;border:0;border-radius:12px;background:#2c2a55;color:#f3efe6;font:500 .85rem "Tahoma",system-ui,sans-serif;min-height:104px;align-items:center;justify-content:center}
.lb b{font-size:1.5rem;font-weight:800;color:#ffb84d}
.lb:disabled{opacity:.4}
@media (max-width:560px){#lv{grid-template-columns:repeat(3,1fr)}}
#stage{position:relative;width:100%;max-width:900px}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(11,13,28,.82);border-radius:14px;padding:8px;color:#f3efe6;text-align:center}
#ov[hidden]{display:none}
#ov h2{margin:0;font-size:1.5rem;font-weight:800}
#ov p{color:#c9c5e6}
#bar{display:flex;gap:10px;align-items:center}
#bar[hidden]{display:none}
.b{font:800 .95rem "Tahoma",system-ui,sans-serif;padding:10px 16px;border:0;border-radius:12px;background:#ffb84d;color:#1d1a33;min-height:44px}
.b.g{background:#3a3768;color:#f3efe6}
#buy{font:800 1rem "Tahoma",system-ui,sans-serif;padding:12px 22px;border:0;border-radius:12px;background:#ffb84d;color:#1d1a33;min-height:48px}
#buy:disabled{background:#4a476b;color:#a9a5c8}
#buy[hidden]{display:none}

body{background:radial-gradient(ellipse at top,#2a2150,#0b0d1c 70%) fixed;color:#f3efe6;overscroll-behavior:none;touch-action:manipulation;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
p{color:#9a96bd}
h1{font-size:1.7rem;letter-spacing:.5px}
#stage{width:min(100%,max(300px,calc((100vh - 120px)*2)),900px)}
#menu{width:min(100%,900px)}
#rot{display:none;color:#ffb84d;font-weight:800}
@media (orientation:portrait) and (max-width:700px){#rot{display:block}}
@media (max-height:500px){h1{font-size:1.1rem}body>p{display:none}body{gap:6px;padding:6px}}
</style>
</head>
<body>
<h1>🏃 المانيكان العدّاء</h1>
<p id="rot">↻ دوّر الجوال بالعرض لتجربة أفضل</p>
<noscript><p>فعّل JavaScript من إعدادات المتصفح لتشغيل اللعبة</p></noscript>
<div id="menu" hidden><p>اختر المرحلة — كل مرحلة أصعب من اللي قبلها</p><div id="lv"></div></div>
<div id="stage" hidden><canvas id="c"></canvas><div id="ov" hidden></div></div>
<div id="bar" hidden><button id="buy" hidden></button><button id="home" class="b g">☰ القائمة</button><button id="fs" class="b g" hidden>⛶</button></div>
<p>اقفز بالضغط على الشاشة • الطعام الأخضر للطاقة • البنزين الأزرق للدراجة • الأفضل بالوضع الأفقي</p>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),btn=document.getElementById('buy');
const W=800,H=400,G=330;
cv.width=W*2;cv.height=H*2;ctx.scale(2,2);
const V=[{n:'مشي'},{n:'سيكل',cost:25,e:'🚲'},{n:'دراجة نارية',cost:60,e:'🏍️'}];
const BASE=[5,7.5,10.5],DRAIN=[.03,.035,.02],HW=[11,22,26],PH=[64,66,68];
let state='menu',lvl=0,unlocked=1,banner=0,score=0,coins=0,veh=0,energy=100,fuel=100,inv=0,speed=5,dist=0,obs=[],items=[],p,t=0,nextGap=450,itemGap=300,last=0,btnKey='';
try{unlocked=+localStorage.getItem('mq-unlocked')||1}catch(e){}
const rnd=(a,b)=>a+Math.random()*(b-a);
const types=[{w:34,h:34,k:'spike'},{w:40,h:48,k:'box'},{w:72,h:34,k:'spike2'},{w:30,h:68,k:'box'}];
const LV=[
{n:'الحارة الهادئة',goal:1500,gap:1.3,sp:0,dr:.8,im:1,pool:2,sky:['#0f1430','#43306b'],hl:['#262c5c','#1a1f44'],gd:'#0c0f22',mo:'#f6e7b4'},
{n:'الضاحية',goal:2500,gap:1.15,sp:.3,dr:.9,im:1,pool:3,sky:['#1a2a52','#c0607a'],hl:['#3a3f78','#2a2d5e'],gd:'#14152e',mo:'#ffe3c2'},
{n:'الصحراء',goal:3500,gap:1,sp:.6,dr:1,im:1.1,pool:4,sky:['#3b1d12','#e08a3c'],hl:['#8a4a2a','#5e2f1c'],gd:'#2a140c',mo:'#ffe9b0'},
{n:'الجبل',goal:4500,gap:.92,sp:1,dr:1.15,im:1.25,pool:4,sky:['#0b2a3a','#5fa3b8'],hl:['#3c6f85','#1f4358'],gd:'#0a1a24',mo:'#e8f7ff'},
{n:'الليلة الأخيرة',goal:6000,gap:.85,sp:1.5,dr:1.3,im:1.4,pool:4,sky:['#050509','#4a0f2a'],hl:['#2a1020','#17080f'],gd:'#07050a',mo:'#ff7a7a'}
];
const $=id=>document.getElementById(id),menu=$('menu'),stage=$('stage'),ov=$('ov'),bar0=$('bar'),home=$('home'),lvEl=$('lv');
const stars=Array.from({length:40},()=>({x:rnd(0,W),y:rnd(0,180),r:rnd(.6,1.6)}));
let sky;function theme(){const L=LV[lvl];sky=ctx.createLinearGradient(0,0,0,G);sky.addColorStop(0,L.sky[0]);sky.addColorStop(1,L.sky[1])}

function reset(){veh=0;coins=0;energy=100;fuel=100;inv=0;speed=5;dist=0;score=0;obs=[];items=[];t=0;p={y:G,vy:0};nextGap=450;itemGap=300;banner=150;theme()}
reset();

function jump(){
  if(state!=='play')return;
  if(state==='over'){if(performance.now()-overAt>400){reset();state='play'}return}
  if(p.y>=G-0.5)p.vy=-13.5;
}
function buy(){
  if(state!=='play'||veh>=2)return;
  const n=V[veh+1];
  if(coins<n.cost)return;
  coins-=n.cost;veh++;if(veh===2)fuel=100;
}
addEventListener('keydown',e=>{
  if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)jump()}
  if(e.code==='KeyB')buy();
});
cv.addEventListener('pointerdown',e=>{e.preventDefault();jump()});
btn.addEventListener('click',()=>{buy();btn.blur()});
home.addEventListener('click',()=>{showMenu();home.blur()});

let reason='';
function end(why){reason=why;finish(false)}
function finish(win){
  state=win?'win':'over';
  const fin=lvl>=4;
  if(win&&!fin&&lvl+1>=unlocked){unlocked=lvl+2;try{localStorage.setItem('mq-unlocked',unlocked)}catch(e){}}
  ov.innerHTML='<h2>'+(win?(fin?'🏆 أنهيت اللعبة!':'نجحت في المرحلة '+(lvl+1)):reason)+'</h2><p>المسافة: '+Math.min(score,LV[lvl].goal)+' م من '+LV[lvl].goal+' م • الكوينز: '+coins+'</p><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"></div>';
  const row=ov.lastChild;
  const add=(txt,cls,fn)=>{const b=document.createElement('button');b.className='b '+cls;b.textContent=txt;b.onclick=fn;row.appendChild(b)};
  if(win&&!fin)add('المرحلة التالية','',()=>start(lvl+1));
  add('إعادة','g',()=>start(lvl));add('القائمة','g',showMenu);
  ov.hidden=false;
}
function start(i){lvl=i;reset();state='play';menu.hidden=true;stage.hidden=false;bar0.hidden=false;ov.hidden=true}
function showMenu(){
  state='menu';menu.hidden=false;stage.hidden=true;bar0.hidden=true;ov.hidden=true;lvEl.innerHTML='';
  LV.forEach((L,i)=>{
    const b=document.createElement('button');b.className='lb';b.disabled=i>=unlocked;
    b.innerHTML='<b>'+(i<unlocked?i+1:'🔒')+'</b>'+L.n+'<span>'+'●'.repeat(i+1)+'○'.repeat(4-i)+'</span><span>'+L.goal+' م</span>';
    b.onclick=()=>start(i);lvEl.appendChild(b);
  });
}

function spawnItem(){
  const hi=Math.random()<.5,y=hi?G-100:G-26,r=Math.random();
  const cLim=veh===2?.55:.85,fLim=veh===2?.7:1;
  if(r<cLim){const n=2+(Math.random()*3|0);for(let i=0;i<n;i++)items.push({x:W+20+i*34,y,k:'c'})}
  else if(r<fLim)items.push({x:W+20,y,k:'f'});
  else items.push({x:W+20,y,k:'g'});
}

function step(dt){
  const empty=veh===2&&fuel<=0;
  const target=empty?4.5:BASE[veh]+LV[lvl].sp+Math.min(2,dist/6000);
  speed+=(target-speed)*.05*dt;
  dist+=speed*dt;score=dist/10|0;t+=speed*.1*dt;
  energy-=DRAIN[veh]*LV[lvl].dr*dt;
  if(veh===2)fuel=Math.max(0,fuel-.06*dt);
  if(inv>0)inv-=dt;
  if(banner>0)banner-=dt;
  p.vy+=0.65*dt;p.y+=p.vy*dt;
  if(p.y>=G){p.y=G;p.vy=0}
  nextGap-=speed*dt;itemGap-=speed*dt;
  if(nextGap<=0){const o={...types[Math.random()*LV[lvl].pool|0]};o.x=W+20;obs.push(o);nextGap=(rnd(260,420)+speed*22)*LV[lvl].gap}
  if(itemGap<=0){spawnItem();itemGap=(rnd(380,600)+speed*25)*LV[lvl].im}
  obs.forEach(o=>o.x-=speed*dt);items.forEach(i=>i.x-=speed*dt);
  obs=obs.filter(o=>o.x+o.w>-10);items=items.filter(i=>i.x>-30);
  const hw=HW[veh],ph=PH[veh];
  for(const o of obs){
    const top=G-o.h+(o.k==='box'?4:12);
    if(inv<=0&&o.x+5<120+hw&&o.x+o.w-5>120-hw&&p.y>top){energy-=25;inv=70}
  }
  items=items.filter(i=>{
    if(Math.abs(i.x-120)<hw+12&&i.y>p.y-ph-10&&i.y<p.y+10){
      if(i.k==='c')coins++;
      else if(i.k==='f')energy=Math.min(100,energy+30);
      else fuel=Math.min(100,fuel+40);
      return false;
    }
    return true;
  });
  if(energy<=0){energy=0;end('نفدت طاقتك!')}
  else if(score>=LV[lvl].goal)finish(true);
}

function limb(x,y,a1,l1,a2,l2,w){
  const kx=x+Math.sin(a1)*l1,ky=y+Math.cos(a1)*l1;
  ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(kx,ky);ctx.lineTo(kx+Math.sin(a2)*l2,ky+Math.cos(a2)*l2);ctx.stroke();
  ctx.fillStyle='#b9ae9a';ctx.beginPath();ctx.arc(kx,ky,w*.38,0,7);ctx.fill();
}
function drawMan(cx,fy,m,air){
  const s=Math.sin(t),q=Math.sin(t*2),hipY=fy-30,shY=fy-56;
  const L=m===0?[air?-.3:-s*.9,air?.9:s*.9]:m===1?[.7+q*.4,.7-q*.4]:[1,1];
  const K=m===0?[L[0]-(air?1.1:Math.max(0,s)*1.1),L[1]-(air?1.1:Math.max(0,-s)*1.1)]:m===1?[L[0]-1.2,L[1]-1.2]:[.2,.2];
  const A=m===0?[air?2.5:s*.9,air?2.8:-s*.9]:[1.7,1.7];
  const AK=m===0?[A[0]+.5,A[1]+.5]:[1.4,1.4];
  ctx.strokeStyle='#f4efe6';
  limb(cx,hipY,L[0],15,K[0],15,9);limb(cx,shY,A[0],13,AK[0],12,7);
  ctx.fillStyle='#f4efe6';ctx.beginPath();ctx.roundRect(cx-9,fy-62,18,34,7);ctx.fill();
  ctx.fillRect(cx-2,fy-67,4,7);
  ctx.beginPath();ctx.ellipse(cx+1,fy-75,8,10,0,0,7);ctx.fill();
  ctx.fillStyle='#b9ae9a';ctx.fillRect(cx-9,hipY-2,18,3);
  ctx.strokeStyle='#e5ded0';limb(cx,hipY,L[1],15,K[1],15,9);
  ctx.strokeStyle='#f4efe6';limb(cx,shY,A[1],13,AK[1],12,7);
}
function wheel(x,y,r){
  const a=dist/r;
  ctx.strokeStyle='#f4efe6';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.stroke();
  ctx.lineWidth=1.5;ctx.beginPath();
  for(let i=0;i<2;i++){const c=Math.cos(a+i*1.57)*r,s=Math.sin(a+i*1.57)*r;ctx.moveTo(x+c,y+s);ctx.lineTo(x-c,y-s)}
  ctx.stroke();
}
function drawRider(py,air){
  if(veh===0){drawMan(120,py,0,air);return}
  if(veh===1){
    const wy=py-14;
    wheel(98,wy,14);wheel(142,wy,14);
    ctx.strokeStyle='#ffb84d';ctx.lineWidth=3;ctx.beginPath();
    ctx.moveTo(98,wy);ctx.lineTo(114,wy-24);ctx.lineTo(136,wy-26);ctx.lineTo(142,wy);
    ctx.moveTo(114,wy-24);ctx.lineTo(120,wy);ctx.lineTo(98,wy);ctx.stroke();
    drawMan(114,py-8,1,air);return;
  }
  const wy=py-15;
  wheel(96,wy,15);wheel(144,wy,15);
  ctx.strokeStyle='#f4efe6';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(144,wy);ctx.lineTo(136,wy-32);ctx.lineTo(128,wy-34);ctx.stroke();
  ctx.fillStyle='#6a6f99';ctx.fillRect(112,wy-12,22,12);
  ctx.fillStyle='#ffb84d';ctx.beginPath();ctx.roundRect(106,wy-30,34,14,5);ctx.fill();
  ctx.fillStyle='#262c5c';ctx.beginPath();ctx.roundRect(96,wy-22,22,6,3);ctx.fill();
  if(fuel>0){ctx.fillStyle='#ff8a3d';ctx.beginPath();ctx.moveTo(80,wy-6);ctx.lineTo(66-Math.random()*8,wy-3);ctx.lineTo(80,wy);ctx.fill()}
  drawMan(110,py-7,2,air);
}
function drawItem(i){
  const y=i.y+Math.sin(t*3+i.x*.05)*3;
  if(i.k==='c'){ctx.fillStyle='#ffd34d';ctx.beginPath();ctx.arc(i.x,y,10,0,7);ctx.fill();ctx.strokeStyle='#c99a1a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(i.x,y,5,0,7);ctx.stroke()}
  else if(i.k==='f'){ctx.fillStyle='#7ee081';ctx.beginPath();ctx.arc(i.x,y,12,0,7);ctx.fill();ctx.fillStyle='#2f9e44';ctx.beginPath();ctx.ellipse(i.x+4,y-13,6,3,-.5,0,7);ctx.fill()}
  else{ctx.fillStyle='#4dc3ff';ctx.beginPath();ctx.roundRect(i.x-10,y-12,20,24,4);ctx.fill();ctx.fillStyle='#1b7fb3';ctx.fillRect(i.x+1,y-18,8,7);ctx.fillStyle='#e8f7ff';ctx.fillRect(i.x-6,y-4,12,3)}
}
function bar(y,v,col,label){
  ctx.direction='rtl';ctx.textAlign='right';ctx.fillStyle='#f3efe6';ctx.font='500 14px Tahoma,sans-serif';ctx.fillText(label,W-20,y+11);
  ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(W-170,y,100,12);
  ctx.fillStyle=v<25?'#ff5d73':col;ctx.fillRect(W-170,y,v,12);
}

function draw(){
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  ctx.fillStyle=LV[lvl].mo;ctx.globalAlpha=.7;stars.forEach(s=>{ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()});
  ctx.globalAlpha=1;ctx.beginPath();ctx.arc(660,80,28,0,7);ctx.fill();
  [[.15,LV[lvl].hl[0],60,.008],[.4,LV[lvl].hl[1],34,.014]].forEach(([k,col,h,f])=>{
    ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,G);
    for(let x=0;x<=W;x+=20)ctx.lineTo(x,G-h+Math.sin((x+dist*k)*f)*h*.5);
    ctx.lineTo(W,G);ctx.fill();
  });
  ctx.fillStyle=LV[lvl].gd;ctx.fillRect(0,G,W,H-G);
  ctx.fillStyle='#ffb84d';ctx.fillRect(0,G,W,3);
  ctx.fillStyle='#2a2f5e';
  for(let x=-(dist%70);x<W;x+=70)ctx.fillRect(x,G+22,30,4);
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(120,G+6,(veh?30:16)-(G-p.y)*.05,4,0,0,7);ctx.fill();
  for(const o of obs){
    ctx.fillStyle='#ff5d73';
    if(o.k==='box'){ctx.fillRect(o.x,G-o.h,o.w,o.h);ctx.fillStyle='#ffb84d';ctx.fillRect(o.x,G-o.h,o.w,6)}
    else{const n=o.k==='spike'?1:2,sw=o.w/n;for(let i=0;i<n;i++){ctx.beginPath();ctx.moveTo(o.x+i*sw,G);ctx.lineTo(o.x+i*sw+sw/2,G-o.h);ctx.lineTo(o.x+(i+1)*sw,G);ctx.fill()}}
  }
  items.forEach(drawItem);
  if(!(inv>0&&(inv/6|0)%2))drawRider(p.y,p.y<G-1);
  // HUD
  ctx.direction='ltr';ctx.textAlign='left';
  ctx.fillStyle='#ffd34d';ctx.beginPath();ctx.arc(30,28,9,0,7);ctx.fill();
  ctx.fillStyle='#f3efe6';ctx.font='800 22px Tahoma,sans-serif';ctx.fillText(coins,48,36);
  ctx.font='500 14px Tahoma,sans-serif';ctx.fillStyle='#c9c5e6';ctx.fillText('L'+(lvl+1)+' • '+score+'/'+LV[lvl].goal+' m',20,58);
  ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(W/2-100,12,200,8);ctx.fillStyle='#ffd34d';ctx.fillRect(W/2-100,12,200*Math.min(1,score/LV[lvl].goal),8);
  if(banner>0){ctx.direction='rtl';ctx.textAlign='center';ctx.globalAlpha=Math.min(1,banner/40);ctx.fillStyle='#f3efe6';ctx.font='800 34px Tahoma,sans-serif';ctx.fillText('المرحلة '+(lvl+1)+': '+LV[lvl].n,W/2,150);ctx.globalAlpha=1;ctx.direction='ltr';ctx.textAlign='left'}
  bar(14,energy,'#7ee081','الطاقة');
  if(veh===2){bar(34,fuel,'#4dc3ff','البنزين');
    if(fuel<=0&&state==='play'&&(t*3|0)%2){ctx.direction='rtl';ctx.textAlign='center';ctx.fillStyle='#ff5d73';ctx.font='800 20px Tahoma,sans-serif';ctx.fillText('البنزين خلص! اجمع علبة بنزين',W/2,60)}}
  ctx.direction='rtl';ctx.textAlign='center';
  if(0){
    ctx.fillStyle='rgba(11,13,28,.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#f3efe6';ctx.font='800 38px Tahoma,sans-serif';
    ctx.fillText(state==='ready'?'المانيكان العدّاء':reason,W/2,130);
    ctx.font='500 19px Tahoma,sans-serif';
    if(state==='ready'){
      ctx.fillStyle='#f3efe6';ctx.fillText('تبدأ ماشي واجمع الكوينز، اشترِ سيكل ثم دراجة نارية',W/2,175);
      ctx.fillText('الطاقة تنقص: خذ الطعام الأخضر • الدراجة تحتاج بنزين أزرق',W/2,205);
    }else{
      ctx.fillStyle='#f3efe6';ctx.fillText('المسافة: '+score+' م  |  أفضل مسافة: '+best+' م',W/2,180);
    }
    ctx.fillStyle='#ffb84d';ctx.fillText(state==='ready'?'اضغط للبدء':'اضغط للعب مرة ثانية',W/2,250);
  }
}

function refreshBtn(){
  let key='h',txt='',dis=true;
  if(state==='play'&&veh<2){const n=V[veh+1];key=veh+'|'+(coins>=n.cost);txt='اشترِ '+n.n+' '+n.e+' — '+n.cost+' كوين';dis=coins<n.cost}
  if(key!==btnKey){btnKey=key;btn.hidden=key==='h';btn.textContent=txt;btn.disabled=dis}
}

function loop(ts){
  const dt=Math.min(2,(ts-last)/16.67||1);last=ts;
  if(state==='play')step(dt);
  if(state!=='menu')draw();refreshBtn();requestAnimationFrame(loop);
}
const fs=$('fs');
if(document.documentElement.requestFullscreen){fs.hidden=false;fs.onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){};fs.blur()}}
showMenu();requestAnimationFrame(loop);
</script>
